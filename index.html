<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azzyra's Little World</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #ffd6e8, #e4d4ff, #cfe8ff);
      font-family: Georgia, serif;
      color: #5a3e5b;
      text-align: center;
    }
    header {
      padding: 80px 20px 40px;
    }
    h1 {
      font-size: 2.8rem;
      color: #c2549a;
      margin: 0 0 10px;
    }
    .tagline {
      font-size: 1.2rem;
      color: #8a6a9b;
      font-style: italic;
    }
    section {
      background: rgba(255, 255, 255, 0.6);
      max-width: 500px;
      margin: 25px auto;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(180, 120, 200, 0.2);
    }
    h2 {
      color: #9a5cc2;
      margin-top: 0;
    }
    a {
      display: inline-block;
      background: #c2549a;
      color: white;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 25px;
    }
    a:hover {
      background: #9a5cc2;
    }
    footer {
      padding: 30px;
      color: #8a6a9b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to My Little World! ✨</h1>
    <p class="tagline">A little world full of dreams.</p>
  </header>

  <section>
    <h2>Tentang Aku</h2>
    <p>Halo! Aku Azzyra. Aku suka nulis cerita dan bikin dunia kecilku sendiri.</p>
  </section>

  <section>
    <h2>Ceritaku</h2>
    <p>Baca petualangan seruku di Wattpad ya!</p>
    <a href="GANTI_DENGAN_LINK_WATTPAD_KAMU">Baca di Wattpad 📖</a>
  </section>

  <footer>Dibuat dengan 💜 oleh Azzyra</footer>
</body>
</html>
